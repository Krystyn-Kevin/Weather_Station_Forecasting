<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Weather Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Station Telemetry</h1>
            <p>Live data streaming from ThingSpeak</p>
        </header>

        <!-- Control Panel -->
        <div class="card controls">
            <label for="timeRange"><strong>Time Range:</strong></label>
            <select id="timeRange">
                <option value="60">Last 60 Minutes</option>
                <option value="720">Last 12 Hours</option>
                <option value="1440" selected>Last 24 Hours</option>
            </select>
        </div>

        <div class="dashboard-grid">
            <!-- Current Stats Card -->
            <div class="card">
                <h2>Latest Reading</h2>
                <div class="data-point">
                    <span class="label">Temperature:</span>
                    <span class="value" id="current-temp">-- °C</span>
                </div>
                <div class="data-point">
                    <span class="label">Humidity:</span>
                    <span class="value" id="current-hum">-- %</span>
                </div>
                <div class="data-point">
                    <span class="label">Pressure:</span>
                    <span class="value" id="current-pre">-- hPa</span>
                </div>
            </div>

            <!-- Prediction Card -->
            <div class="card highlight">
                <h2>Tomorrow's Prediction</h2>
                <p class="subtitle">Based on linear regression trend</p>
                <div class="data-point">
                    <span class="label">Est. Baseline Temp:</span>
                    <span class="value" id="predicted-temp">-- °C</span>
                </div>
            </div>
        </div>

       <!-- Separate Graph Cards -->
        <div class="card">
            <h2>Temperature Trend</h2>
            <div class="chart-wrapper">
                <canvas id="tempChart"></canvas>
            </div>
        </div>
        
        <div class="card">
            <h2>Humidity Trend</h2>
            <div class="chart-wrapper">
                <canvas id="humChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>Pressure Trend</h2>
            <div class="chart-wrapper">
                <canvas id="preChart"></canvas>
            </div>
        </div>

    <script src="js/script.js"></script>
</body>
</html>
